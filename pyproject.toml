[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-wise-agent"
version = "1.0.4"
description = "AI coding assistant with pluggable tools and token tracking, built on OpenHands SDK"
requires-python = ">=3.12"
dependencies = [
    "openhands-ai>=1.4.0",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
]

[project.scripts]
twa = "agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["benchmarks/tasks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]

[dependency-groups]
dev = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]
